<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
    <marker id="arrow-graphite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#101418"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#101418">Job Lifecycle — state machine (SPEC §5)</text>

  <!-- QUEUED -->
  <rect x="410" y="70" width="180" height="52" rx="8" fill="#f6f8fa" stroke="#101418" stroke-width="1.5"/>
  <text x="500" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#101418">QUEUED</text>
  <text x="500" y="111" text-anchor="middle" font-size="10" fill="#57606a">available_at ≤ now, waiting</text>

  <!-- RUNNING -->
  <rect x="410" y="210" width="180" height="52" rx="8" fill="#fff7e8" stroke="#f5a623" stroke-width="1.5"/>
  <text x="500" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#101418">RUNNING</text>
  <text x="500" y="251" text-anchor="middle" font-size="10" fill="#57606a">lease held, worker executes</text>

  <!-- RETRYING -->
  <rect x="110" y="210" width="180" height="52" rx="8" fill="#ffffff" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="200" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#101418">RETRYING</text>
  <text x="200" y="251" text-anchor="middle" font-size="10" fill="#57606a">backoff wait</text>

  <!-- Terminals -->
  <rect x="60" y="400" width="170" height="52" rx="8" fill="#eef7ef" stroke="#2ea043" stroke-width="1.5"/>
  <text x="145" y="423" text-anchor="middle" font-size="15" font-weight="bold" fill="#101418">SUCCEEDED</text>
  <text x="145" y="441" text-anchor="middle" font-size="10" fill="#57606a">terminal</text>

  <rect x="275" y="400" width="170" height="52" rx="8" fill="#fdecee" stroke="#f85149" stroke-width="1.5"/>
  <text x="360" y="423" text-anchor="middle" font-size="15" font-weight="bold" fill="#101418">FAILED</text>
  <text x="360" y="441" text-anchor="middle" font-size="10" fill="#57606a">terminal</text>

  <rect x="490" y="400" width="170" height="52" rx="8" fill="#fdecee" stroke="#f85149" stroke-width="1.5"/>
  <text x="575" y="423" text-anchor="middle" font-size="15" font-weight="bold" fill="#101418">TIMED_OUT</text>
  <text x="575" y="441" text-anchor="middle" font-size="10" fill="#57606a">terminal</text>

  <rect x="705" y="400" width="170" height="52" rx="8" fill="#f6f8fa" stroke="#101418" stroke-width="1.5"/>
  <text x="790" y="423" text-anchor="middle" font-size="15" font-weight="bold" fill="#101418">CANCELLED</text>
  <text x="790" y="441" text-anchor="middle" font-size="10" fill="#57606a">terminal</text>

  <!-- QUEUED -> RUNNING -->
  <path d="M 500 122 L 500 206" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="510" y="170" font-size="11" fill="#57606a">claim</text>

  <!-- RETRYING <-> RUNNING -->
  <path d="M 290 228 L 404 228" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="348" y="219" text-anchor="middle" font-size="11" fill="#57606a">re-claim</text>
  <path d="M 410 244 L 296 244" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="352" y="262" text-anchor="middle" font-size="11" fill="#57606a">retryable fail</text>

  <!-- RUNNING -> terminals -->
  <path d="M 460 262 L 152 396" stroke="#2ea043" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 480 262 L 362 396" stroke="#f85149" stroke-width="1.5" fill="none" marker-end="url(#arrow-rose)"/>
  <path d="M 520 262 L 573 396" stroke="#f85149" stroke-width="1.5" fill="none" marker-end="url(#arrow-rose)"/>
  <path d="M 560 262 L 788 396" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- QUEUED -> CANCELLED (immediate) -->
  <path d="M 590 96 L 840 96 L 840 396" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="715" y="88" text-anchor="middle" font-size="11" fill="#57606a">cancel (immediate)</text>

  <!-- RETRYING -> CANCELLED -->
  <path d="M 110 236 L 60 236 L 60 490 L 790 490 L 790 456" stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="425" y="508" text-anchor="middle" font-size="11" fill="#57606a">cancel while waiting</text>

  <!-- manual retry (dashed) -->
  <path d="M 875 426 L 950 426 L 950 56 L 500 56 L 500 66" stroke="#101418" stroke-width="1.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-graphite)"/>
  <text x="720" y="48" text-anchor="middle" font-size="11" fill="#101418">manual retry (from FAILED, TIMED_OUT, CANCELLED) — resets retry_count</text>

  <!-- Footnotes -->
  <text x="60" y="556" font-size="11" fill="#57606a">QUEUED → RUNNING: worker claim via SELECT … FOR UPDATE SKIP LOCKED (atomic; one attempt, one worker)</text>
  <text x="60" y="574" font-size="11" fill="#57606a">RUNNING → RETRYING: retryable failure with retry_count &lt; max_retries; waits available_at = now() + min(300, 2^retry_count · 5) s</text>
  <text x="60" y="592" font-size="11" fill="#57606a">RUNNING → CANCELLED: cancel sets cancel_requested; worker honors it cooperatively, sweeper finalizes after lease expiry + 30 s</text>
  <text x="60" y="610" font-size="11" fill="#57606a">FAILED / TIMED_OUT / CANCELLED → QUEUED: manual retry via POST /api/v1/jobs/{id}/retry (owner or OPERATOR+), resets retry_count</text>
  <text x="60" y="628" font-size="11" fill="#57606a">Every transition is validated by the backend state machine (JobStateMachine); illegal transitions are rejected.</text>
</svg>
